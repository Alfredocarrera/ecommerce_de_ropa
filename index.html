<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloth Store</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main>
        <header>
            <section class="contenedor-perfil">
                <h3 id="saludo">Hello, Welcome</h3>
                <h1 id="nombUsuario"> Alfredo Carrera</h1>
                <img class="img_perfil" src="./storage/img/foto_perfil.jpeg" alt="imagen usuario">
            </section>
        </header>
        <section class="contenedor-busqueda">
            <input type="text" id="busqueda" placeholder="Serch">
            <button >option</button>
        </section>
        <br>
        <br>
        <section class="contenedor-botones">
            <section> 
                <button class="btn-negro" >
                    <img src="./storage/iconos/all-items.svg" alt="" class="icono-btn">
                    <span class="texto">All Items</span> 
                </button>
                <button class="btn-blanco" >
                    <img src="./storage/iconos/dress.svg" alt="" class="icono-btn">
                    <span class="texto">Dress</span> 
                </button>
                <button class="btn-blanco" >
                    <img src="./storage/iconos/tshirt.svg" alt="" class="icono-btn">
                    <span class="texto">T-Shirt</span>    
                </button>
                <button class="btn-blanco" >
                    <img src="./storage/iconos/jeans.svg" alt="" class="icono-btn">
                    <span class="texto">Jeans</span> 
                </button>
                
            </section>
        </section>
        <br>
                           
        <section class="contenedor-imagenes"> 
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_1.jpg" alt="Vestido1">
                <input type="checkbox" id="like-1" class="check-like">  
                <label for="like-1" class="btn-heart" aria-label="Me gusta">  </label>
            </div>   
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_2.jpg" alt="Vestido2">
                <input type="checkbox" id="like-2" class="check-like">
                <label for="like-2" class="btn-heart" aria-label="Me gusta"> </label>
            </div>
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_3.jpg" alt="Vestido3">
                <input type="checkbox" id="like-3" class="check-like">
                <label for="like-3" class="btn-heart" aria-label="Me gusta"> </label>
            </div>
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_4.jpg" alt="Camisa1">
                <input type="checkbox" id="like-4" class="check-like">
                <label for="like-4" class="btn-heart" aria-label="Me gusta"></label>
            </div>
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_5.jpg" alt="Camisa2">
                <input type="checkbox" id="like-5" class="check-like">
                <label for="like-5" class="btn-heart" aria-label="Me gusta"></label>
            </div>
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_6.jpg" alt="Camisa3">
                <input type="checkbox" id="like-6" class="check-like">
                <label for="like-6" class="btn-heart" aria-label="Me gusta"></label>
            </div>
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_7.jpg" alt="Pantalones1">
                <input type="checkbox" id="like-7" class="check-like">
                <label for="like-7" class="btn-heart" aria-label="Me gusta"> </label>
            </div>
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_8.jpg" alt="Pantalones2">
                <input type="checkbox" id="like-8" class="check-like">
                <label for="like-8" class="btn-heart" aria-label="Me gusta"> </label>
            </div>
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_9.jpg" alt="Pantalones3">
                <input type="checkbox" id="like-9" class="check-like">
                <label for="like-9" class="btn-heart" aria-label="Me gusta"> </label>
            </div>
            <div class="tarjeta-imagen">
                <img src="./storage/img/modelo_10.jpg" alt="Pantalones4">
                <input type="checkbox" id="like-10" class="check-like">
                <label for="like-10" class="btn-heart" aria-label="Me gusta"> </label>
            </div>
        </section>
        <nav class="barra-fija">
            <button class="btn-barra">Inicio</button>
            <button class="btn-barra">Compra</button>
            <button class="btn-barra">Like</button>
            <button class="btn-barra">Perfil</button>
        </nav>

    </main>
    
</body>
</html>
