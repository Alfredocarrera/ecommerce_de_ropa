<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
     <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>
    <div class="checkout-container">
        <header class="header">
             <a href="../views/detalle.html"><button class="icon-btn" aria-label="Volver">&lt;</button></a>
                <h1>Checkout</h1>
            <button class="icon-btn" aria-label="Menú">=</button>
        </header>

        <section class="products-list">
            <article class="product-item">
                <img src="../storage/img/modelo_1.jpg" alt="Modern light clothes" class="product-img">
                <div class="product-info">
                    <div class="product-header">
                        <h3>Modern light clothes</h3>
                        <span class="more-options">•••</span>
                    </div>
                    <p class="product-subtitle">Dress modern</p>
                        <div class="product-bottom">
                            <span class="price">$212.99</span>
                                <div class="quantity-controls">
                                    <button class="qty-btn">-</button>
                                        <span class="qty-number">4</span>
                                    <button class="qty-btn">+</button>
                                </div>
                        </div>
                </div>
            </article>

            <article class="product-item">
                <img src="../storage/img/modelo_2.jpg" alt="Modern light clothes" class="product-img">
                    <div class="product-info">
                        <div class="product-header">
                            <h3>Modern light clothes</h3>
                            <span class="more-options">•••</span>
                        </div>
                        <p class="product-subtitle">Dress modern</p>
                        <div class="product-bottom">
                            <span class="price">$162.99</span>
                            <div class="quantity-controls">
                                <button class="qty-btn">-</button>
                                <span class="qty-number">1</span>
                                <button class="qty-btn">+</button>
                            </div>
                        </div>
                    </div>
            </article>
        </section>

        <section class="shipping-section">
            <h2>Shipping Information</h2>
            <div class="payment-card">
                <div class="card-details">
                    <span class="visa-badge">VISA</span>
                    <span class="card-number">•••• •••• •••• 2143</span>
                </div>
                <span class="dropdown-arrow">∨</span>
            </div>
        </section>

        <section class="summary-section">
            <div class="summary-row">
                <span>Total (9 items)</span>
                <strong>$1,014.95</strong>
            </div>
            <div class="summary-row">
                <span>Shipping Fee</span>
                <strong>$0.00</strong>
            </div>
            <div class="summary-row">
                <span>Discount</span>
                <strong>$0.00</strong>
            </div>
            <hr class="divider">
            <div class="summary-row subtotal">
                <span>Sub Total</span>
                <strong>$1,014.95</strong>
            </div>
        </section>
  </div>

  <div class="barra-fija">
    <button class="pay-btn">Pay</button>
  </div>


</body>
</html>
